  # ===================== profile: mwfpm (8.5.11-fpm MULTI-worker pool; scatter + pin) =====================
  # REUSE-first: no per-lab Dockerfile. Reuses the committed 8.5.11-fpm image
  # p2s-vd24481-fpm:8.5.11 (built by the vd24481-8511 profile in
  # docker-compose.versions.yml); its webroot already ships the remote_app.php a7
  # echo sink. A static multi-worker pool (pm.max_children=6) is mounted OVER the
  # image's single-worker pool file zz-vd24481.conf (loaded last, so this wins),
  # plus a bare-number pid.php the scatter check parses as an int. The FastCGI
  # port is published (9181) so poc/chains/fpm_fullchain_multiworker.py can run
  # `pin` mode (one FCGI_KEEP_CONN connection) as well as `scatter` over nginx (:8181).
  mwfpm-fpm:
    profiles: ["mwfpm"]
    image: p2s-vd24481-fpm:8.5.11
    container_name: p2s-mwfpm-fpm
    cap_add:
      - SYS_PTRACE
    ports:
      - "127.0.0.1:9181:9000"
    volumes:
      - ./lab/mwfpm/pool.conf:/usr/local/etc/php-fpm.d/zz-vd24481.conf:ro
      - ./lab/mwfpm/html/pid.php:/var/www/html/pid.php:ro
    networks:
      default:
        aliases: ["fpm"]

  mwfpm-web:
    profiles: ["mwfpm"]
    image: nginx:alpine
    container_name: p2s-mwfpm-web
    depends_on:
      - mwfpm-fpm
    ports:
      - "127.0.0.1:8181:80"
    volumes:
      - ./lab/mwfpm/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      default:
        aliases: ["web"]

# Top-level volumes unioned from the originals (phar declared a named volume).
volumes:
  app: {}
  # opcache lab: docroot + file_cache that must survive the verify's restart (down -v clears).
  opcache-docroot: {}
  opcache-filecache: {}
