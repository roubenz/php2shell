  sfpi-fpm:
    profiles: ["sfpi"]
    # stock 8.4.26-fpm + RO html; writable sinks uploads/ and sess/ are 1777 tmpfs over html/; pool.conf empties security.limit_extensions.
    image: php:8.4.26-fpm@sha256:f5431b57bda75455d5271967cc6b67df8f0d0b943832756e0c78eccdc98767dd
    container_name: p2s-av1-fpm
    volumes:
      - ./lab/sfpi/html:/var/www/html:ro
      - ./lab/sfpi/zz-sfpi.ini:/usr/local/etc/php/conf.d/zz-sfpi.ini:ro
      - ./lab/sfpi/pool.conf:/usr/local/etc/php-fpm.d/zz-sfpi.conf:ro
      - type: tmpfs
        target: /var/www/html/uploads
        tmpfs:
          mode: 01777
      - type: tmpfs
        target: /var/www/html/sess
        tmpfs:
          mode: 01777
    networks:
      default:
        aliases: ["fpm"]

