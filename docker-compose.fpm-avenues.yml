# Consolidated "fpm-avenues" compose file.
#
# Merges the following per-avenue compose files into ONE file using Compose
# `profiles:` (one avenue up at a time). Each original <token> becomes a profile
# name; bring an avenue up with:
#
#   docker compose -f docker-compose.fpm-avenues.yml --profile <token> up -d --build
#   docker compose -f docker-compose.fpm-avenues.yml --profile <token> down
#
# Profiles: a7r5 brleak cw erd filterchain flp fpm426-gdb glc grail hl hz1
#           incrace incvec lexbor nday opcache osh parseroracle pggc phar pkg
#           redissess savepathhijack seat seo sfpi shmfl tp wex
#
# NOTE: gdb labs use image p2s-fpm426-gdb (profile fpm426-gdb); build it first.
#
# MERGE CONVENTION (keeps every PoC working):
#  - This file stays at repo root, so `context: .` and `./lab/...` paths are
#    unchanged and byte-identical to the originals.
#  - Each service key is renamed "<profile>-<origname>" to avoid collisions;
#    every service carries a network alias equal to its ORIGINAL service name so
#    in-network DNS (nginx `fastcgi_pass fpm:9000`, `tcp://redis:6379`, ...)
#    still resolves. Profiles keep one avenue up at a time, so aliases never
#    clash at runtime.
#  - `container_name`, ports, build, image, volumes, environment, command,
#    cap_add, security_opt, depends_on semantics are preserved verbatim.
#  - The original docker-compose.<token>.yml files are retained unchanged; this
#    file is an additive grouped convenience.

services:

  # ===================== profile: fpm426-gdb (shared gdb-analysis base) =====================
  # Shared gdb base image p2s-fpm426-gdb (used by cw grail hl tp glc flp seat brleak); build once.
  fpm426-gdb-base:
    profiles: ["fpm426-gdb"]
    build:
      context: .
      dockerfile: lab/fpm426-gdb/Dockerfile
    image: p2s-fpm426-gdb
    command: ["true"]

  # ===================== profile: a7r5 (project was p2s-a7r5) =====================
  a7r5-fpm:
    profiles: ["a7r5"]
    image: php:8.4.26-fpm@sha256:f5431b57bda75455d5271967cc6b67df8f0d0b943832756e0c78eccdc98767dd
    container_name: p2s-a7r5-fpm
    cap_add:
      - SYS_PTRACE
    volumes:
      - ./lab/a7r5/html:/var/www/html:ro
      - ./lab/a7r5/zz-a7r5.ini:/usr/local/etc/php/conf.d/zz-a7r5.ini:ro
      - ./lab/a7r5/pool.conf:/usr/local/etc/php-fpm.d/zz-a7r5.conf:ro
    networks:
      default:
        aliases: ["fpm"]

  a7r5-web:
    profiles: ["a7r5"]
    image: nginx:alpine
    container_name: p2s-a7r5-web
    depends_on:
      - a7r5-fpm
    ports:
      - "127.0.0.1:8167:80"
    volumes:
      - ./lab/a7r5/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      default:
        aliases: ["web"]

  # ===================== profile: brleak (project was p2s-brleak) =====================
  brleak-fpm:
    profiles: ["brleak"]
    image: p2s-fpm426-gdb
    container_name: p2s-brleak-fpm
    volumes:
      - ./lab/brleak/html:/var/www/html:ro
      - ./lab/brleak/zz-brleak.ini:/usr/local/etc/php/conf.d/zz-brleak.ini:ro
      - ./lab/brleak/pool.conf:/usr/local/etc/php-fpm.d/zz-brleak.conf:ro
    networks:
      default:
        aliases: ["fpm"]

  brleak-web:
    profiles: ["brleak"]
    image: nginx:alpine
    container_name: p2s-brleak-web
    depends_on:
      - brleak-fpm
    ports:
      - "127.0.0.1:8169:80"
    volumes:
      - ./lab/brleak/nginx.conf:/etc/nginx/nginx.conf:ro
