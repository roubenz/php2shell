      - ./lab/app/poc.php:/var/www/html/poc.php:ro
      - ./lab/app/producer.php:/var/www/html/producer.php:ro
      - ./lab/app/r2g.php:/var/www/html/r2g.php:ro
      - ./lab/app/sess.php:/var/www/html/sess.php:ro
      - ./lab/app/unser.php:/var/www/html/unser.php:ro
      - ./lab/glc/plain.php:/var/www/html/plain.php:ro
      - ./lab/glc/warm320.php:/var/www/html/warm320.php:ro
      - ./lab/glc/glc.ini:/usr/local/etc/php/conf.d/zz-glc.ini:ro
      - ./lab/glc/pool.conf:/usr/local/etc/php-fpm.d/zz-glc.conf:ro
    tmpfs:
      - /var/sess
    networks:
      default:
        aliases: ["fpm"]

  glc-web:
    profiles: ["glc"]
    image: nginx:1.27-alpine
    container_name: p2s-glc-web
    depends_on:
      - glc-fpm
    ports:
      - "127.0.0.1:8163:80"
    volumes:
      - ./lab/glc/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      default:
        aliases: ["web"]

  # ===================== profile: grail (project was p2s-grail) =====================
  grail-fpm:
    profiles: ["grail"]
    image: p2s-fpm426-gdb
    container_name: p2s-grail-fpm
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - ./lab/app/index.php:/var/www/html/index.php:ro
      - ./lab/app/poc.php:/var/www/html/poc.php:ro
      - ./lab/app/producer.php:/var/www/html/producer.php:ro
      - ./lab/app/r2g.php:/var/www/html/r2g.php:ro
      - ./lab/app/sess.php:/var/www/html/sess.php:ro
      - ./lab/app/unser.php:/var/www/html/unser.php:ro
      - ./lab/grail/plain.php:/var/www/html/plain.php:ro
      - ./lab/grail/grail.ini:/usr/local/etc/php/conf.d/zz-grail.ini:ro
      - ./lab/grail/pool.conf:/usr/local/etc/php-fpm.d/zz-grail.conf:ro
    tmpfs:
      - /var/sess
    networks:
      default:
        aliases: ["fpm"]

  grail-web:
    profiles: ["grail"]
    image: nginx:1.27-alpine
    container_name: p2s-grail-web
    depends_on:
      - grail-fpm
    ports:
      - "8134:80"
    volumes:
      - ./lab/grail/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      default:
        aliases: ["web"]

  # ===================== profile: hl (project was p2s-hl) =====================
  hl-fpm:
    profiles: ["hl"]
    image: p2s-fpm426-gdb
    container_name: p2s-hl-fpm
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - ./lab/app/index.php:/var/www/html/index.php:ro
      - ./lab/app/poc.php:/var/www/html/poc.php:ro
      - ./lab/app/producer.php:/var/www/html/producer.php:ro
      - ./lab/app/r2g.php:/var/www/html/r2g.php:ro
      - ./lab/app/sess.php:/var/www/html/sess.php:ro
      - ./lab/app/unser.php:/var/www/html/unser.php:ro
      - ./lab/hl/plain.php:/var/www/html/plain.php:ro
      - ./lab/hl/hl.ini:/usr/local/etc/php/conf.d/zz-hl.ini:ro
      - ./lab/hl/pool.conf:/usr/local/etc/php-fpm.d/zz-hl.conf:ro
    tmpfs:
      - /var/sess
    networks:
