  savepathhijack-fpm:
    profiles: ["savepathhijack"]
    # stock 8.4.26-fpm; docroot + /var/sess are tmpfs seeded from html/ (writer drops a .php); pm=static/max_children=1 pool.
    image: php:8.4.26-fpm@sha256:f5431b57bda75455d5271967cc6b67df8f0d0b943832756e0c78eccdc98767dd
    container_name: php2shell-savepathhijack-fpm
    command: ["sh","-c","cp -a /seed/. /var/www/html/ 2>/dev/null; chmod -R a+rX /var/www/html; chmod 1777 /var/www/html; mkdir -p /var/sess; chmod 1777 /var/sess; exec php-fpm"]
    volumes:
      - ./lab/savepathhijack/html:/seed:ro
      - ./lab/savepathhijack/zz-savepathhijack.ini:/usr/local/etc/php/conf.d/zz-savepathhijack.ini:ro
      - ./lab/savepathhijack/pool.conf:/usr/local/etc/php-fpm.d/zz-savepathhijack.conf:ro
    tmpfs:
