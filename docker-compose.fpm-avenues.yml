    security_opt:
      - seccomp:unconfined
    volumes:
      - ./lab/flp/html:/var/www/html:ro
      - ./lab/flp/flp.ini:/usr/local/etc/php/conf.d/zz-flp.ini:ro
      - ./lab/flp/pool.conf:/usr/local/etc/php-fpm.d/zz-flp.conf:ro
    networks:
      default:
        aliases: ["fpm"]

  flp-web:
