        aliases: ["web"]

  # ===================== profile: hz1 (project was p2s-hz1) =====================
  hz1-fpm:
    profiles: ["hz1"]
    image: php:8.4.26-fpm@sha256:f5431b57bda75455d5271967cc6b67df8f0d0b943832756e0c78eccdc98767dd
    container_name: p2s-hz1-fpm
    volumes:
      - ./lab/hz1/html:/var/www/html:ro
      - ./lab/hz1/zz-hz1.ini:/usr/local/etc/php/conf.d/zz-hz1.ini:ro
      - ./lab/hz1/pool.conf:/usr/local/etc/php-fpm.d/zz-hz1.conf:ro
    networks:
      default:
        aliases: ["fpm"]

  hz1-web:
    profiles: ["hz1"]
    image: nginx:alpine
    container_name: p2s-hz1-web
    depends_on: [hz1-fpm]
    ports:
      - "127.0.0.1:8180:80"
    volumes:
      - ./lab/hz1/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      default:
        aliases: ["web"]

  # ===================== profile: incrace (project was php2shell_incrace) =====================
  incrace-fpm:
    profiles: ["incrace"]
    # stock 8.4.26-fpm + RO html + tmpfs /var/sess; stock pm=dynamic/max_children=5 is the race, so no pool mount.
    image: php:8.4.26-fpm@sha256:f5431b57bda75455d5271967cc6b67df8f0d0b943832756e0c78eccdc98767dd
    container_name: php2shell-incrace-fpm
    volumes:
      - ./lab/incrace/html:/var/www/html:ro
      - ./lab/incrace/zz-incrace.ini:/usr/local/etc/php/conf.d/zz-incrace.ini:ro
    tmpfs:
      - /var/sess
    networks:
      default:
        aliases: ["fpm"]

  incrace-web:
    profiles: ["incrace"]
    image: nginx:alpine
    container_name: php2shell-incrace-web
    depends_on:
      - incrace-fpm
    ports:
      - "8120:80"
    volumes:
      - ./lab/incrace/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      default:
        aliases: ["web"]

  # ===================== profile: incvec (project was p2s-a23) =====================
  incvec-fpm:
    profiles: ["incvec"]
    # stock 8.4.26-fpm; writable docroot + log dir are tmpfs seeded from html/; access-log pool fragment alongside www.conf.
    image: php:8.4.26-fpm@sha256:f5431b57bda75455d5271967cc6b67df8f0d0b943832756e0c78eccdc98767dd
    container_name: p2s-a23-fpm
    command: ["sh","-c","cp -a /seed/. /var/www/html/ 2>/dev/null; chmod -R a+rX /var/www/html; chmod 1777 /var/www/html; mkdir -p /var/log/php /var/sess; : > /var/log/php/error.log; : > /var/log/php/access.log; chmod 666 /var/log/php/error.log /var/log/php/access.log; chmod 1777 /var/log/php /var/sess; exec php-fpm"]
    volumes:
      - ./lab/incvec/html:/seed:ro
      - ./lab/incvec/zz-incvec.ini:/usr/local/etc/php/conf.d/zz-incvec.ini:ro
      - ./lab/incvec/zz-access.conf:/usr/local/etc/php-fpm.d/zz-access.conf:ro
    tmpfs:
      - /var/www/html
      - /var/log/php
      - /var/sess
    networks:
      default:
        aliases: ["fpm"]

  incvec-web:
    profiles: ["incvec"]
    image: nginx:alpine
    container_name: p2s-a23-web
    depends_on:
      - incvec-fpm
    ports:
      - "8138:80"
    volumes:
      - ./lab/incvec/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      default:
        aliases: ["web"]

  # ===================== profile: lexbor (no original top-level name) =====================
  lexbor-lexbor:
    profiles: ["lexbor"]
    build:
      context: .
      dockerfile: lab/lexbor/Dockerfile
    image: php2shell-lexbor-asan:latest
    ports:
      - "8493:80"
    volumes:
      - ./lab/lexbor:/work:ro
    environment:
      USE_ZEND_ALLOC: "0"
      USE_TRACKED_ALLOC: "1"
      # log_errors + stderr so the ASan report is captured in `docker logs`.
      ASAN_OPTIONS: "detect_leaks=0:abort_on_error=0:exitcode=99"
    command: >
      php -n
      -d error_reporting=E_ALL -d display_errors=0 -d log_errors=1
      -S 0.0.0.0:80 -t /work
    networks:
      default:
        aliases: ["lexbor"]

  # ===================== profile: nday (project was p2s_nday) =====================
  nday-fpm:
    profiles: ["nday"]
    build:
      context: .
      dockerfile: lab/nday/Dockerfile
    image: p2s-nday-fpm:latest
    container_name: p2s-nday-fpm
    networks:
      default:
        aliases: ["fpm"]

  nday-web:
    profiles: ["nday"]
    image: nginx:alpine
    container_name: p2s-nday-web
    depends_on:
      - nday-fpm
    ports:
      - "8152:80"
    volumes:
      - ./lab/parseroracle/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      default:
        aliases: ["web"]

  # ===================== profile: opcache (project was p2s-av3) =====================
  opcache-fpm:
    profiles: ["opcache"]
    # stock 8.4.26-fpm (opcache from stock image, zz-opcache.ini tunes file_cache).
    # docroot + file_cache are named volumes so the verify's poisoned .bin survives restart (down -v clears).
    image: php:8.4.26-fpm@sha256:f5431b57bda75455d5271967cc6b67df8f0d0b943832756e0c78eccdc98767dd
    container_name: p2s-av3-fpm
    command: ["sh","-c","[ -e /var/www/html/.seeded ] || { cp -a /seed/. /var/www/html/ 2>/dev/null; chmod -R a+rX /var/www/html; chmod 1777 /var/www/html; touch /var/www/html/.seeded; }; chmod 1777 /var/opcache; exec php-fpm"]
    volumes:
      - ./lab/opcache/html:/seed:ro
      - ./lab/opcache/zz-opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
      - opcache-docroot:/var/www/html
      - opcache-filecache:/var/opcache
    networks:
      default:
        aliases: ["fpm"]

  opcache-web:
    profiles: ["opcache"]
    image: nginx:1.27-alpine
    container_name: p2s-av3-web
    depends_on:
      - opcache-fpm
    ports:
      - "127.0.0.1:8144:80"
    volumes:
      - ./lab/opcache/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      default:
        aliases: ["web"]

  # ===================== profile: osh (project was p2s-osh) =====================
  osh-fpm:
    profiles: ["osh"]
