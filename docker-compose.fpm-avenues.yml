    networks:
      default:
        aliases: ["web"]

  # ===================== profile: flp (project was p2s-flp) =====================
  flp-fpm:
    profiles: ["flp"]
    image: p2s-fpm426-gdb
    container_name: p2s-flp-fpm
    cap_add:
