  # ===================== profile: cw (project was p2s-cw) =====================
  cw-fpm:
    profiles: ["cw"]
    image: p2s-fpm426-gdb
    container_name: p2s-cw-fpm
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - ./lab/app/index.php:/var/www/html/index.php:ro
      - ./lab/app/poc.php:/var/www/html/poc.php:ro
      - ./lab/app/producer.php:/var/www/html/producer.php:ro
      - ./lab/app/r2g.php:/var/www/html/r2g.php:ro
      - ./lab/app/sess.php:/var/www/html/sess.php:ro
      - ./lab/app/unser.php:/var/www/html/unser.php:ro
      - ./lab/cw/plain.php:/var/www/html/plain.php:ro
      - ./lab/cw/cw.ini:/usr/local/etc/php/conf.d/zz-cw.ini:ro
      - ./lab/cw/pool.conf:/usr/local/etc/php-fpm.d/zz-cw.conf:ro
      - type: tmpfs
        target: /var/sess
        tmpfs:
          mode: 01777
    networks:
      default:
        aliases: ["fpm"]

