    networks:
      default:
        aliases: ["web"]

  # ===================== profile: fpmps (ps_files->basedir file-write finisher) =====================
  fpmps-fpm:
    profiles: ["fpmps"]
    image: php:8.4.26-fpm
    container_name: p2s-fpmps-fpm
    cap_add:
      - SYS_PTRACE
    volumes:
      - ./lab/fpmps/html:/var/www/html:ro
      - ./lab/fpmps/pool.conf:/usr/local/etc/php-fpm.d/zz-fpmps.conf:ro

  fpmps-web:
    profiles: ["fpmps"]
    image: nginx:1.27-alpine
    container_name: p2s-fpmps-web
    depends_on:
      - fpmps-fpm
    ports:
      - "127.0.0.1:18082:80"
    volumes:
      - ./lab/fpmps/nginx.conf:/etc/nginx/nginx.conf:ro

  # ===================== profile: fpmfire (fire-the-write finisher: fpmps + writable web-served /pub) =====================
  # Byte-identical to fpmps (same image/pool.conf/html/nginx dispatch) EXCEPT a
  # writable, web-served /var/www/html/pub (tmpfs 1777) modeling the common
  # "writable uploads dir under docroot" case. Used to demonstrate firing the
  # ps_files->basedir file-write as code: write the webshell into /pub, GET it.
  fpmfire-fpm:
    profiles: ["fpmfire"]
    image: php:8.4.26-fpm
    container_name: p2s-fpmfire-fpm
    cap_add:
      - SYS_PTRACE
    volumes:
      - ./lab/fpmfire/html:/var/www/html:ro
      - ./lab/fpmfire/pool.conf:/usr/local/etc/php-fpm.d/zz-fpmps.conf:ro
    tmpfs:
      - /var/www/html/pub:mode=1777

  fpmfire-web:
    profiles: ["fpmfire"]
    image: nginx:1.27-alpine
    container_name: p2s-fpmfire-web
    depends_on:
      - fpmfire-fpm
    ports:
      - "127.0.0.1:18085:80"
    volumes:
      - ./lab/fpmfire/nginx.conf:/etc/nginx/nginx.conf:ro

  # ===================== profile: fpmfiremw (multi-worker fire-the-write finisher) =====================
  # 6-worker variant of fpmfire (same image/pool.conf except pm.max_children/
  # start_servers=6). Reuses fpmfire's arm/echo/probe.php and apsf's sess.php
  # (the pure-HTTP session seat) directly -- no duplicated endpoints.
  fpmfiremw-fpm:
    profiles: ["fpmfiremw"]
    image: php:8.4.26-fpm
    container_name: p2s-fpmfiremw-fpm
    cap_add:
      - SYS_PTRACE
    volumes:
      - ./lab/fpmfire/html/arm.php:/var/www/html/arm.php:ro
      - ./lab/fpmfire/html/echo.php:/var/www/html/echo.php:ro
      - ./lab/fpmfire/html/probe.php:/var/www/html/probe.php:ro
      - ./lab/apsf/html/sess.php:/var/www/html/sess.php:ro
      - ./lab/fpmfiremw/pool.conf:/usr/local/etc/php-fpm.d/zz-fpmfiremw.conf:ro
    tmpfs:
