  filterchain-fpm:
    profiles: ["filterchain"]
    image: php:8.4.26-fpm@sha256:f5431b57bda75455d5271967cc6b67df8f0d0b943832756e0c78eccdc98767dd
    container_name: p2s-fc-fpm
    volumes:
      - ./lab/filterchain/index.php:/var/www/html/index.php:ro
    networks:
      default:
        aliases: ["fpm"]

  filterchain-web:
    profiles: ["filterchain"]
    image: nginx:alpine
    container_name: p2s-fc-web
    depends_on:
      - filterchain-fpm
    ports:
