events {}
http {
    include /etc/nginx/mime.types;
    server {
        listen 80;
        root /var/www/html;
        index index.php;
        client_max_body_size 8m;
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass fpm:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
            fastcgi_read_timeout 60s;
            # stream the body to fpm live so the upload-progress slow-drip race
            # (gadget delivery) has a real on-disk window; default buffering
            # would absorb the drip and fpm would only see a completed upload.
            fastcgi_request_buffering off;
        }
        location / { try_files $uri /index.php?$query_string; }
    }
}
