; Crash-oracle lab tuning. display_errors is OFF on purpose: the ONLY channel
; the oracle is allowed is worker liveness (200 vs 502), never reflected text.
display_errors = Off
log_errors = On
error_reporting = E_ALL
memory_limit = 128M
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 64
; exif knobs left at stock defaults (exif.decode_* etc.)
