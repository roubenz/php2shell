; Single static worker so the crash-oracle bit is unambiguous: any parse that
; kills the worker makes the NEXT FastCGI request 502/reset until the master
; respawns a fresh worker (which, being fork()ed from the master, keeps the
; identical ASLR layout -- see native_parser_crash_oracle.py --aslr).
[www]
pm = static
pm.max_children = 1
catch_workers_output = yes
