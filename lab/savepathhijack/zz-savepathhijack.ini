; savepath-hijack lab: stock 128M so one request can OOM the parse/decode and
; leave the pre-RINIT BG(unserialize) decoder dangling. upload_progress On +
; cleanup On (the chain survives cleanup by OOMing before END). strict_mode Off
; so the attacker picks the session id.
memory_limit = 128M
post_max_size = 32M
max_input_vars = 1000000
max_file_uploads = 1000000
max_multipart_body_parts = 1000000
session.save_path = /var/sess
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
session.upload_progress.min_freq = 0
session.upload_progress.freq = 1%
session.use_strict_mode = Off
session.use_cookies = 0
session.use_only_cookies = 0
display_errors = Off
log_errors = On
