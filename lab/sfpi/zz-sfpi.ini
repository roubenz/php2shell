; php-fpm ini for the nginx SCRIPT_FILENAME / path-info injection lab.
; cgi.fix_pathinfo=1 is PHP's compiled default; set explicitly so the lab is
; self-documenting (it is the knob that makes the pathinfo walk-back happen).
cgi.fix_pathinfo = 1

; session dir lives UNDER the docroot so the pathinfo injection can reach a
; poisoned sess_<sid> file (variant b, no uploaded file needed).
session.save_path = /var/www/html/sess
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
session.upload_progress.min_freq = 0
session.upload_progress.freq = 1%
session.use_strict_mode = Off

file_uploads = On
upload_max_filesize = 8M
post_max_size = 16M
display_errors = Off
log_errors = On
; NOTE: security.limit_extensions is a php-fpm POOL directive, not a php.ini
; setting, so it is NOT configured here -- it is emptied in the Dockerfile.
; EMPIRICAL FINDING (8.4.26): the stock default (".php .php3 .php4 .php5
; .php7") is checked against the fix_pathinfo-RESOLVED file (avatar.jpg /
; sess_<sid>), which has no allowed extension, so stock fpm returns 403
; "Access denied" and the attack does NOT land. Loosening/clearing it (modeled
; in the Dockerfile) is the precondition that makes the RCE land.
