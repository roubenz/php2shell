events {}
http {
    include /etc/nginx/mime.types;
    server {
        listen 80;
        root /var/www/html;
        index index.php;
        client_max_body_size 16m;

        # MITIGATED php location: the one-line fix. `try_files $uri =404`
        # makes nginx 404 any .php URI that is not a real file on disk, so
        # /uploads/avatar.jpg/x.php and /sess/sess_<sid>/x.php never reach
        # fpm. (This conf is loaded by the sfpi verify script to prove the
        # mitigation empirically; it is not used by the default lab.)
        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_pass fpm:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }

        location / { try_files $uri $uri/ =404; }
    }
}
