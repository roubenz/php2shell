events {}
http {
    include /etc/nginx/mime.types;
    server {
        listen 80;
        root /var/www/html;
        index index.php;
        client_max_body_size 16m;

        # VULNERABLE php location: the classic misconfig.
        #   * regex `\.php$` matches ANY URI ending in .php, including
        #     /uploads/avatar.jpg/x.php and /sess/sess_<sid>/x.php;
        #   * NO `try_files` guard, so nginx never checks the .php path is a
        #     real file before handing it off;
        #   * SCRIPT_FILENAME is built straight from the request URI, so fpm
        #     receives /var/www/html/uploads/avatar.jpg/x.php. With
        #     cgi.fix_pathinfo=1 php walks back to the existing avatar.jpg (or
        #     sess_<sid>) and executes it as PHP.
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass fpm:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }

        location / { try_files $uri $uri/ =404; }
    }
}
