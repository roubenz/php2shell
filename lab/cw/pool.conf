[www]
; Multi-worker pool: the race storm holds ONE worker for the whole slow drip,
; so >=2 free workers must remain to serve the plain oracle/landing requests
; concurrently. pm=static keeps every worker warm with the identical fork-shared
; ASLR layout (php-fpm base + mmap chunk identical across all children).
pm = static
pm.max_children = 6
catch_workers_output = yes
; keep workers immortal so the gdb-assisted PG write (mechanism proof) sticks
pm.max_requests = 0
