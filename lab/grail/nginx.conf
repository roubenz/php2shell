events {}
http {
    include /etc/nginx/mime.types;
    server {
        listen 80;
        root /var/www/html;
        index plain.php index.php;
        # stock-ish body cap; the race storm (~0.6MB) is well under this.
        client_max_body_size 8m;
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass fpm:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
        # NOTE: no include-param rewrite here. The landing page plain.php takes
        # NO includable parameter -- RCE arrives via PG(auto_prepend_file), not
        # via any application include().
        location / { try_files $uri /plain.php; }
    }
}
