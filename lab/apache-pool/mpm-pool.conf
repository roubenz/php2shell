# A real 10-child prefork pool (vs. lab/apache's single immortal child). Here
# Apache scatters connections across 10 independent heaps + ASLR, so the a6
# cross-request groom (A dangles a slot, B reclaims it) only lands when A and B
# hit the SAME child - the exact condition the slowloris WorkerPin forces.
# Used to prove the pin in isolation (poc/verify_worker_pin.py), not to run the
# full chain. MaxConnectionsPerChild 0 = never retire a child on request count.
<IfModule mpm_prefork_module>
    StartServers 10
    MinSpareServers 10
    MaxSpareServers 10
    MaxRequestWorkers 10
    MaxConnectionsPerChild 0
</IfModule>
