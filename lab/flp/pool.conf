[www]
; Multi-worker static pool: the probe attaches gdb to ONE warm worker to drive
; the allocator mechanism; the remaining workers keep serving the warm-up /proc
; oracle. pm=static keeps every child's fork-shared ASLR identical (php-fpm base
; + the request-heap chunk base are the same in every worker), which is what
; lets a single shadow_key read (chunk-local) apply to all workers.
pm = static
pm.max_children = 6
catch_workers_output = yes
; immortal workers so the attached-worker state (and the fork-shared layout)
; stays put across the A/B mechanism probes.
pm.max_requests = 0
