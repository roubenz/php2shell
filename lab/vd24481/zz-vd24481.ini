; #24481 remote-delivery lab INI. Stock-ish; the var_destroy UAF needs no
; special settings beyond a memory_limit that tolerates the >1018-value outer
; array and the 512M nested work. display_errors off so nothing leaks via error
; text -- the sink reflects only the JSON working-set.
memory_limit=512M
post_max_size=64M
max_input_vars=1000000
error_reporting=E_ERROR
display_errors=0
log_errors=1
