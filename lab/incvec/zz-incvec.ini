; incvec lab PHP config -- stock-ish, plus what the A2 vectors exercise.
session.save_path = /var/sess
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
session.upload_progress.min_freq = 0
session.upload_progress.freq = 1%
session.use_strict_mode = Off
display_errors = Off
log_errors = On
; log-poison target: PHP's own error log, readable+includable by the www-data
; worker that writes it (self-contained in the fpm container).
error_log = /var/log/php/error.log
; log-poison PRECONDITION: with html_errors=On (the compiled default) PHP
; HTML-escapes the logged path ('<' -> '&lt;'), which breaks the '<?php' tag in
; the log and defeats error-log poisoning. html_errors=Off keeps the payload raw.
; See include_vectors.py logpoison note -- this is a real, common wall.
html_errors = Off
; re-read .user.ini every request so the dropped auto_prepend_file activates
; immediately. Stock default is 300s (user_ini.cache_ttl) -- on a real target
; the operator waits out that TTL instead; see include_vectors.py userini note.
user_ini.cache_ttl = 0
