; incvec lab: enable the php-fpm pool access log with a format that records the
; request User-Agent VERBATIM. This is the html_errors-INDEPENDENT log-poison
; sink (unlike PHP's error log, fpm's access logging never passes through PHP's
; error-message HTML formatter, so '<' is not escaped to '&lt;'). Not a stock
; default (access.log ships commented out) but a very common operational config;
; the same sink exists as the web server's own access log in mod_php/single-host
; deployments (unreachable here only because nginx runs in a separate container).
[www]
access.log = /var/log/php/access.log
access.format = "%{HTTP_USER_AGENT}e"
