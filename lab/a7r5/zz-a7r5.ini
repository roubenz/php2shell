; a7r5 "8.4.26 fire shim" lab INI. Stock-ish; the a7 var_hash UAF needs no
; special settings. display_errors off so nothing leaks via error text.
memory_limit=128M
post_max_size=64M
max_input_vars=1000000
max_file_uploads=1000000
error_reporting=E_ALL
display_errors=0
log_errors=1

; Session/upload_progress settings for the script_unserialize_oom_arm.py
; dangle-reuse pair (arm.php -> echo.php): the consumer's pre-RINIT rfc1867
; decode is what reuses the dangling BG(unserialize), independent of a7's
; own var_hash-UAF endpoints above.
session.save_path=/tmp
session.upload_progress.enabled=1
session.upload_progress.freq=1
session.upload_progress.min_freq=0
session.upload_progress.cleanup=0
