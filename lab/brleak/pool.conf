[www]
; One immortal worker so the a7 R: leak request and every forged-IS_STRING read
; that derives binbase from it hit the SAME child -> one request-heap fate, one
; stable 2MB chunk. The php-fpm PIE base is fork-shared from the master and is
; fixed for the master's lifetime (survives worker respawns).
pm = static
pm.max_children = 1
catch_workers_output = yes
