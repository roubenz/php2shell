# One immortal prefork child: leak round (R1+R2) and the follow-on rce round
# serialize to the same fork-family. When the leaking child crashes, Apache
# forks a replacement from the master with the SAME ASLR (binary base /
# request-heap chunk), so the disclosed addresses stay valid for the next
# request. MaxConnectionsPerChild 0 = never retire a child on request count.
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 1
    MaxRequestWorkers 1
    MaxConnectionsPerChild 0
</IfModule>
