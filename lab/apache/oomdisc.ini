; OOM-discriminator lab overlay (poc/oom_discriminator.py + verify).
; Mounted into conf.d AFTER zz-php2shell.ini (loads alphabetically later), so
; it only flips display_errors On while inheriting the whole a6 session config
; (memory_limit=16M, sid_length=256, upload_progress, ...) baked into the
; php2shell_c2-apache-vuln image. display_errors=On makes PHP emit the
;   "Allowed memory size of N bytes exhausted (tried to allocate M bytes)"
; fatal into the response body, which is the measurement this helper reads.
display_errors=On
html_errors=0
log_errors=1
