; php2shell lab (Apache/mod_php): only the memory limit should bound request
; parsing. Matches the cli-vuln target's session config exactly, because a6's
; disclosure depends on it: the cookie is the vector (use_cookies=1), the
; 256-char sid governs the b320 slot the fake reclaims (sid_length=256), and
; strict mode is off so the reclaimed non-canonical sid is not re-created.
memory_limit=16M
post_max_size=32M
max_input_vars=1000000
max_file_uploads=1000000
max_multipart_body_parts=1000000
session.save_path=/tmp/sess
session.upload_progress.enabled=1
session.upload_progress.freq=1%
session.upload_progress.min_freq=0
session.use_cookies=1
session.use_only_cookies=0
session.use_strict_mode=0
session.sid_length=256
error_reporting=E_ALL
display_errors=0
log_errors=1
