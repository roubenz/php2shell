[www]
; MULTI-worker pool: a real static pool so requests scatter across workers and
; the offset-free fpm RCE must land over scattered nginx HTTP (scatter mode) or
; a single pinned FastCGI connection (pin mode). fpm ASLR is fork-shared, so all
; six workers share the master's PIE base (binbase/chunk/spray-slot are
; worker-invariant), which is what makes the chain scatter-safe.
pm = static
pm.max_children = 6
catch_workers_output = yes
