events {}
http {
    include /etc/nginx/mime.types;
    server {
        listen 80;
        root /var/www/html;
        index index.php;
        client_max_body_size 64m;
        location ~ \.php$ {
            include fastcgi_params;
            # Pass to this lab's OWN fpm service by its unique compose service
            # name (not the shared "fpm" network alias) so scatter mode round-
            # robins only across THIS pool's workers and a co-resident avenue on
            # the same default network can never serve our requests.
            fastcgi_pass mwfpm-fpm:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
            fastcgi_read_timeout 120s;
        }
        location / { try_files $uri /index.php?$query_string; }
    }
}
