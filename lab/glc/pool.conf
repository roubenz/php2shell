[www]
; Multi-worker static pool. The probe attaches gdb to ONE warm worker to seat
; the poison + drive the allocator mechanism; the remaining workers keep serving
; the warm-up /proc oracle and the plain-GET auto_append oracle concurrently.
; pm=static keeps every child's fork-shared ASLR identical (php-fpm base + the
; request-heap chunk base are the same in every worker), which is what lets a
; single shadow_key read (chunk-local) and a single derived core_globals apply
; across workers.
pm = static
pm.max_children = 6
catch_workers_output = yes
; immortal workers so the gdb-seated poison / clean write (mechanism proof) and
; the fork-shared layout stay put across the A/B probes.
pm.max_requests = 0
