; glc lab -- multi-worker php-fpm 8.4.26, grail/cw clone + the flp bin-320 warm
; page. STOCK-class config (upload_progress on, strict_mode off) EXCEPT session
; cleanup=0, so the race-poisoned session file PERSISTS on disk for the
; PG(auto_append_file) dispatch to keep including it on every subsequent request.
; ZEND_MM_HEAP_PROTECTION is a compile-time default (on) in the stock image, so
; the free-list shadow gate under study is present as shipped. A small
; memory_limit keeps the request heap compact so a warm worker's bin-320 free
; list is easy to inspect.
memory_limit=16M
post_max_size=32M
max_input_vars=1000000
max_file_uploads=1000000
max_multipart_body_parts=1000000

session.save_path=/var/sess
session.upload_progress.enabled=1
session.upload_progress.freq=1%
session.upload_progress.min_freq=0
session.upload_progress.cleanup=0
session.use_cookies=1
session.use_only_cookies=0
session.use_strict_mode=0

error_reporting=E_ALL
display_errors=0
log_errors=1
