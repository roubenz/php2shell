; OPcache SHM lab -- SHARED-MEMORY opcode cache (the SHM route under study).
;
; Contrast with the file_cache lab (docker-compose.fpm-avenues.yml --profile opcache): here there is
; NO file_cache; scripts compile into the opcache SHM mmap and are loaded from
; it on every subsequent request with NO per-request re-validation of the SHM
; body (unlike the file_cache .bin, which is adler32-checked at each load). That
; asymmetry is the whole point of the SHM route: a one-time SHM corruption of a
; cached zend_op->handler fires on the next call with no checksum to clear.
zend_extension=opcache

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128      ; SHM op_array/interned region size (MiB)
opcache.interned_strings_buffer=8   ; interned-strings sub-buffer (MiB)
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0       ; scripts cached once, never re-stat'd
opcache.huge_code_pages=0           ; keep SHM a single plain mmap (no hugepage)
opcache.preferred_memory_model=mmap ; force the mmap handler (Linux default)

; JIT is OFF in the base image; the .jit variant ini overrides these.
opcache.jit=off
opcache.jit_buffer_size=0

display_errors=Off
log_errors=On
