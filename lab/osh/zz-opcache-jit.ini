; OPcache SHM lab -- JIT variant. Same SHM opcode cache, plus the tracing JIT so
; the JIT CODE BUFFER (a separate RX sub-region carved from the opcache SHM) is
; present and locatable. Corrupting live JIT'd machine code is the other SHM
; code-exec target this probe characterises.
zend_extension=opcache

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
opcache.huge_code_pages=0
opcache.preferred_memory_model=mmap

; tracing JIT, generous buffer so the RX JIT region is a clear, sizeable mapping.
opcache.jit=tracing
opcache.jit_buffer_size=64M
opcache.jit_hot_loop=1
opcache.jit_hot_func=1

display_errors=Off
log_errors=On
