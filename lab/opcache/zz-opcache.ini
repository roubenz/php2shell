; AVENUE #3 lab -- OPcache file-cache poisoning config.
;
; The classic file-cache RCE preconditions:
;   * file_cache set to a dir the attacker can write,
;   * file_cache_only=1 -- opcode scripts are loaded straight from the .bin,
;     the SHM cache is bypassed entirely (so no SHM comparison protects us),
;   * validate_timestamps=0 -- the loader does NOT compare the source file's
;     mtime against the .bin header timestamp, so a poisoned .bin executes even
;     when it no longer matches the on-disk source. (With =1 the attacker must
;     also match the source mtime in the header; see the verifier's gate test.)
;   * file_cache_consistency_checks=1 -- the loader adler32-validates the .bin
;     body; a corrupt/partial drop is rejected (kept ON to prove the checksum
;     gate, NOT relaxed to make the attack easier).
zend_extension=opcache

opcache.enable=1
opcache.enable_cli=1
opcache.file_cache=/var/opcache
opcache.file_cache_only=1
opcache.validate_timestamps=0
opcache.file_cache_consistency_checks=1

; keep errors off the wire; the lab proves execution via command output markers.
display_errors=Off
log_errors=On
