# One immortal prefork child (same pattern as lab/apache/mpm-one.conf):
# leak round and the follow-on round serialize to the same fork-family, and
# Apache replaces a crashed child with a sibling sharing the master's ASLR.
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 1
    MaxRequestWorkers 1
    MaxConnectionsPerChild 0
</IfModule>
