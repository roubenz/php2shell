; AVENUE #2 (phar:// deserialization) lab PHP config -- stock-ish.
display_errors = Off
log_errors = On
; phar.require_hash defaults to On (1): a readable phar must carry a valid
; signature. The polyglot built by poc/phar_deser_trigger.py embeds a correct
; SHA1 signature, so this default does NOT block it (left explicit to document
; that the attack survives the default, not a weakened config).
phar.require_hash = 1
phar.readonly = 1
; file uploads on (stock); the app's getimagesize() upload filter is the thing
; the JPEG/phar polyglot has to pass, not an ini gate.
file_uploads = On
upload_max_filesize = 8M
post_max_size = 8M
