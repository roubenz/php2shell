events {}
http {
    include /etc/nginx/mime.types;
    server {
        listen 80;
        root /var/www/html;
        index index.php;
        client_max_body_size 8m;

        # Uploaded files are served as static data (NOT passed to fpm), so a
        # dropped *.jpg polyglot can never be executed by hitting it directly --
        # it is only dangerous through the phar:// wrapper in inspect.php. The
        # webshell the POP chain drops is a *.php in the docroot root, which the
        # \.php$ location below does pass to fpm (that is the landed RCE).
        location ^~ /uploads/ { default_type application/octet-stream; }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass fpm:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
        location / { try_files $uri /index.php?$query_string; }
    }
}
