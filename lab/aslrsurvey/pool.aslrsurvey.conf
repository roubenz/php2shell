; Hope-B3/B5 ASLR-delta survey pool.
;
; Loads AFTER the baked zz-php2shell.conf (zzzz- sorts last in php-fpm.d/), so it
; overrides the single-worker pin with a small STATIC pool of sibling workers.
; All siblings are fork()ed from the one master, so this lets one trial measure:
;   (a) the per-restart module/chunk bases (any worker; fork-shared with master),
;   (b) sibling-vs-sibling invariance WITHIN a master (should be identical), and
;   (c) crash/respawn invariance (kill a worker, the respawn keeps the layout).
;
; pm.max_requests = 0 => workers are immortal, so a warmed chunk persists for the
; master's lifetime and /proc reflects the resting post-request heap state.
[www]
pm = static
pm.max_children = 4
pm.max_requests = 0
catch_workers_output = yes
