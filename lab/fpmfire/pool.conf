[www]
pm = static
pm.max_children = 1
pm.start_servers = 1
listen = 9000
catch_workers_output = yes
php_admin_value[memory_limit] = 128M
php_admin_flag[display_errors] = on
php_admin_value[session.save_path] = /tmp
php_admin_flag[session.upload_progress.enabled] = on
php_admin_value[session.upload_progress.min_freq] = 1
php_admin_flag[session.upload_progress.cleanup] = off
php_admin_value[session.use_only_cookies] = 0
php_admin_value[session.use_cookies] = 1
php_admin_value[session.use_strict_mode] = 0
php_admin_value[post_max_size] = 64M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[max_file_uploads] = 20000
php_admin_value[max_input_vars] = 20000

; html_errors=off: the ps_files_open warning-disclosure read (read_leak/
; ps_files_warning_disclosure.py) needs raw (non-UTF8-sanitized) leaked bytes;
; does not affect the already-landed write/fire chains (they don't parse
; warning text).
php_admin_flag[html_errors] = off
