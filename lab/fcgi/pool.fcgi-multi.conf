; FastCGI auto_prepend_file delivery pool.
;
; Loads AFTER the baked zz-php2shell.conf (zzzz- sorts last in php-fpm.d/), so it
; overrides the single-worker pin with a small STATIC pool of sibling workers for
; the PHP_VALUE=auto_prepend_file FastCGI delivery harness.
;
; pm.max_requests = 0 => workers are immortal for the master's lifetime.
[www]
pm = static
pm.max_children = 4
pm.max_requests = 0
catch_workers_output = yes
