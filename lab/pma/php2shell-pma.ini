; phpMyAdmin INI overrides for the php2shell pma lab (optional; not mounted
; by default). The stock image sets memory_limit=512M / post_max_size=300M /
; session.save_path=/sessions (phpmyadmin-misc.ini via MEMORY_LIMIT /
; UPLOAD_LIMIT / SESSION_SAVE_PATH env), which is far more than a real
; fat-session producer can reach through HTTP alone (the biggest plain-HTTP
; session builder is the userconfig preference store, ~100 KB per request;
; post_max_size caps the per-request JSON value at 300M in theory but PHP's
; own request parsing holds the whole body in memory, so the practical HTTP
; ceiling is memory_limit / post_max_size themselves).
;
; To make the a3-family producer practical on the real application, shrink the
; window: memory_limit just above the session record size the attacker can
; build. With the default 512M you would need a ~500MB session record; with
; 32M you need a ~30MB record - reachable with ~300 config/set requests of
; 100KB each (or one 30MB value, bounded by post_max_size=36M below).
;
; Activate by uncommenting the volume line in docker-compose.apps.yml --profile pma.
memory_limit=32M
post_max_size=36M
upload_max_filesize=32M
; keep the rest stock so session mechanics stay production-shaped
; (use_strict_mode=0 + use_only_cookies=0: the multipart form field
; PHPSESSID=<SID> names the session at request-startup decode time,
; the stock php -S poc shape; the app never sees these requests)
session.save_path=/sessions
session.upload_progress.enabled=1
session.upload_progress.freq=1%
session.upload_progress.min_freq=1
session.use_cookies=1
session.use_strict_mode=0
session.use_only_cookies=0
