# One immortal prefork child for the phpMyAdmin target (lab/apache/mpm-one.conf
# pattern): the producer OOM (fat session record -> memory_limit fatal inside
# php_var_unserialize during session_start) must land on the SAME Apache child
# as the follow-on upload-progress consumer multipart, so the dangling
# BG(unserialize) bookkeeping is still in place when the next request's
# request-startup session decode runs. MaxConnectionsPerChild 0 = the child is
# never retired on request count.
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 1
    MaxRequestWorkers 1
    MaxConnectionsPerChild 0
</IfModule>
