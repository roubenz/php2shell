[www]
; One immortal worker so the arm (which leaves BG(unserialize) dangling) and the stage
; request (which re-uses that dangling decoder) hit the SAME child, and so the chunk base
; is fork-fixed for the master's lifetime -- matches the a7r5 / vd24481 fpm labs. A shaping
; request that OOMs the parser is respawned into this same single slot; the chain polls
; /pid.php between shaping rounds to wait for the replacement.
pm = static
pm.max_children = 1
catch_workers_output = yes
