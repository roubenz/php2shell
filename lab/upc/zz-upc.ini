; upc lab -- stock PHP-fpm (version via the PHP_VERSION build arg; reference target runs 8.3.26),
; directives mirrored from the reference target's info.php, the functional stand-in for the
; stock phpMyAdmin reference target: session.upload_progress.cleanup=On is the condition the
; chain beats.
;
; memory_limit is NOT set here -- the Dockerfile ARG MEMORY_LIMIT writes it into zz-mem.ini
; so the 512M and 32M targets differ in exactly one directive.

; --- request / upload surface (reference target values) ---
file_uploads = On
enable_post_data_reading = On
post_max_size = 8M
upload_max_filesize = 20M
max_file_uploads = 20
max_input_vars = 30000
max_input_nesting_level = 64
max_multipart_body_parts = -1
default_charset = "UTF-8"
display_errors = On
expose_php = On
max_execution_time = 30

; --- session / upload-progress (reference target values); cleanup=On is the condition we beat ---
session.save_handler = files
; session.save_path left at the compiled default (empty => /tmp), matching the reference target
session.serialize_handler = php
session.gc_maxlifetime = 1440
session.use_strict_mode = On
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
session.upload_progress.name = PHP_SESSION_UPLOAD_PROGRESS
session.upload_progress.prefix = upload_progress_

; --- opcache (reference target: enabled, cli off) ---
opcache.enable = 1
opcache.enable_cli = 0
