[www]
; Multi-worker static pool: pm=static keeps every worker warm with the
; identical fork-shared ASLR layout (php-fpm PIE base + mmap chunk identical
; across all children of one master), so the /proc ground-truth measurement
; reads the same layout the attack would face.
pm = static
pm.max_children = 6
catch_workers_output = yes
pm.max_requests = 0
