events {}
http {
    include /etc/nginx/mime.types;
    server {
        listen 80;
        root /var/www/html;
        index plain.php index.php;
        client_max_body_size 8m;
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass fpm:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
        # No include-param rewrite: plain.php takes NO includable parameter; a PG
        # dispatch (not an application include) is the only way a marker appears.
        location / { try_files $uri /plain.php; }
    }
}
