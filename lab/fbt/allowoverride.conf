# Realistic fbt precondition: attacker controls a .htaccess that can set
# php_value. php_value/php_flag in .htaccess require AllowOverride to include
# Options (All covers it). Without this the junkdir/.htaccess php_value is
# ignored (500 "not allowed here") and the primitive cannot be reached.
<Directory /var/www/html>
    AllowOverride All
</Directory>
