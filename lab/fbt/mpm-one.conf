# One immortal prefork child. Each fbt attack SIGSEGVs the sole worker; Apache
# respawns a pristine sibling, so the next attack's fatal.php is again the
# first request that child serves (the pristine-child precondition, for free).
# MaxConnectionsPerChild 0 = never retire a child on request count.
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 1
    MaxRequestWorkers 1
    MaxConnectionsPerChild 0
</IfModule>
