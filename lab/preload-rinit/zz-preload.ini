; php2shell preload-rinit lab (CVE-2026-109619 pre-RINIT session deserialization).
; opcache.preload makes the gadget class exist BEFORE RINIT; the upload-progress
; handler then instantiates it and runs __wakeup() ahead of the request script.
memory_limit = 256M
post_max_size = 8M
upload_max_filesize = 8M
file_uploads = On
display_errors = Off
log_errors = On

opcache.enable = 1
opcache.enable_cli = 1
opcache.preload = /var/www/preload_gadget.php
opcache.preload_user = www-data

session.upload_progress.enabled = On
session.upload_progress.cleanup = 0
session.upload_progress.min_freq = 0
session.upload_progress.freq = 1%
session.save_path = "/tmp"
session.serialize_handler = php
session.use_strict_mode = 0
session.use_cookies = 1
session.use_only_cookies = 1
session.cache_limiter = ""
