# One immortal prefork child: producer (arm) and consumer (stage) must hit the
# same worker, and a respawned sibling shares the master's ASLR base.
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 1
    ServerLimit 1
    MaxRequestWorkers 1
    MaxConnectionsPerChild 0
</IfModule>
