; Stock-ish Apache mod_php lab config (128M). Only memory_limit bounds request
; parsing; session.upload_progress.cleanup=On is the realistic default the HTTP
; accumulation seat has to beat. save_path=/tmp is the compiled default.
memory_limit=128M
post_max_size=64M
max_input_vars=1000000
max_multipart_body_parts=1000000
session.save_path=/tmp
session.upload_progress.enabled=1
session.upload_progress.cleanup=On
session.use_strict_mode=0
