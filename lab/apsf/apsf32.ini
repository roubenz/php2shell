; 32M variant for the HTTP-accumulation seat study (research.apache_accum_cap): the lower
; limit reaches the accumulation cap / flush-ceiling in far fewer requests. Geometry
; (E/DT/ps_files/AIM) is memory_limit-invariant, so calibration transfers from the 128M labs.
memory_limit=32M
post_max_size=64M
max_input_vars=1000000
max_multipart_body_parts=1000000
session.save_path=/tmp
session.upload_progress.enabled=1
session.upload_progress.cleanup=On
session.use_strict_mode=0
