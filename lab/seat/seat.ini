; Free-list-head SEAT (seat) lab -- stock-class php-fpm 8.4.26 ini. Nothing here
; touches the allocator: ZEND_MM_HEAP_PROTECTION is a compile-time default (on)
; in the stock image, so the per-slot shadow is present as shipped -- which is
; precisely what the HEAD poison avoids needing (the head array is unshadowed).
memory_limit=128M
display_errors=0
log_errors=1
error_reporting=E_ALL
session.save_path=/tmp
