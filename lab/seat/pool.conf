[www]
; Multi-worker static pool: the probe attaches gdb to ONE warm worker to deposit
; the single raw head write and observe the emalloc return; the other workers
; keep serving the warm-up /proc oracle. pm=static keeps every child's
; fork-shared ASLR identical.
pm = static
pm.max_children = 6
catch_workers_output = yes
pm.max_requests = 0
