# One immortal prefork child (same pattern as lab/apache-stock/mpm-one.conf):
# the poison deposit, the far emalloc and the follow-on auto_prepend request all
# serialize to the SAME worker process, so the overwrite of PG(auto_prepend_file)
# in that worker's .bss is observed by the next HTTP request it serves.
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 1
    MaxRequestWorkers 1
    MaxConnectionsPerChild 0
</IfModule>
