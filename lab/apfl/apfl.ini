; Apache free-list-poison -> libphp (apfl) lab ini. Nothing here touches the
; allocator: ZEND_MM_HEAP_PROTECTION is a compile-time default (on) in the stock
; image, so the shadow gate under study is present exactly as shipped. A compact
; memory_limit keeps the request heap small so a warm worker's bin-320 free list
; is easy to inspect; display_errors Off mirrors php.ini-production.
memory_limit=128M
display_errors=0
log_errors=1
error_reporting=E_ALL
session.save_path=/tmp/sess
