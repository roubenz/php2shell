[www]
; Multi-worker static pool: the probe attaches gdb to ONE warm worker to drive
; the allocator + SHM overwrite mechanism; the remaining workers keep serving the
; warm-up oracle and provide a sacrificial worker for the control-transfer proof.
; pm=static keeps every child's fork-shared ASLR identical (php-fpm base, the
; request-heap chunk base, AND the opcache SHM mmap are the same in every worker
; -- the SHM is mmap'd by the master BEFORE fork), so a single shadow_key read
; (chunk-local) and a single SHM-base derivation apply to all workers.
pm = static
pm.max_children = 6
catch_workers_output = yes
; immortal workers so the attached-worker state (and the fork-shared layout) stays
; put across the probe's requests.
pm.max_requests = 0
