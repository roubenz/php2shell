; JIT variant of the shmfl opcache ini. With tracing JIT the opcache SHM is a
; single (memory_consumption + jit_buffer_size) shmem object placed HIGH, 2 MiB-
; aligned, at a CONSTANT delta below the PIE: binbase - SHM == 0xc000000 (128M +
; 64M) in this lab. So SHM is derivable from binbase ALONE (0 reads) in JIT mode,
; unlike the no-jit case (binbase + a .bss SHM pointer + 1 read). The trailing
; r-xs JIT CODE buffer is executable+shared (W^X via mprotect).
zend_extension=opcache

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
opcache.huge_code_pages=0
opcache.preferred_memory_model=mmap
opcache.protect_memory=0
opcache.consistency_checks=0

opcache.jit=tracing
opcache.jit_buffer_size=64M

display_errors=Off
log_errors=On
