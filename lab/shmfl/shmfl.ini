; shmfl lab -- stock-class php-fpm 8.4.26 ini. Nothing here touches the
; allocator: ZEND_MM_HEAP_PROTECTION is a compile-time default (on) in the stock
; image, so the shadow gate under study is present as shipped. A compact request
; heap keeps a warm worker's bin-320 free list easy to inspect.
memory_limit=128M
display_errors=0
log_errors=1
error_reporting=E_ALL
session.save_path=/tmp
