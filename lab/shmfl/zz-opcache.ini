; OPcache SHM lab -- SHARED-MEMORY opcode cache (the SHM route under study).
;
; Scripts compile into the opcache SHM mmap and are loaded from it on every
; subsequent request with NO per-request re-validation of the SHM body (unlike a
; file_cache .bin, which is adler32-checked at each load). That asymmetry is the
; whole point: a one-time SHM corruption of a cached zend_op->handler fires on
; the next call with NO checksum to clear (opcache.consistency_checks defaults 0,
; opcache.protect_memory defaults 0 -> the op_array region stays rw-s writable).
zend_extension=opcache

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128      ; SHM op_array/interned region size (MiB)
opcache.interned_strings_buffer=8   ; interned-strings sub-buffer (MiB)
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0       ; scripts cached once, never re-stat'd
opcache.huge_code_pages=0           ; keep SHM a single plain mmap (no hugepage)
opcache.preferred_memory_model=mmap ; force the mmap handler (Linux default)
opcache.protect_memory=0            ; (default) op_array SHM stays rw-s writable
opcache.consistency_checks=0        ; (default) no per-load SHM checksum

; JIT is OFF (base service). The .jit variant ini overrides these so SHM = binbase
; - 0xc000000 (pure arithmetic, 0 reads) instead of binbase + .bss ptr + 1 read.
opcache.jit=off
opcache.jit_buffer_size=0

display_errors=Off
log_errors=On
