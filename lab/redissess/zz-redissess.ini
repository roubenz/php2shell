; AVENUE #8: session records in redis instead of on local disk.
session.save_handler = redis
session.save_path = "tcp://redis:6379"
; serialize_handler defaults to `php`, so a planted  key|O:...  record is
; object-injected on read (the handler-mismatch escalation's payload, delivered
; by a direct store write instead of the upload-progress `|`-in-key trick).
session.serialize_handler = php
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
session.upload_progress.min_freq = 0
session.upload_progress.freq = 1%
session.use_strict_mode = Off
display_errors = Off
log_errors = On
