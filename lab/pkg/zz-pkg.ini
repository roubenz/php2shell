; wex "widened exfil" lab INI. Stock-ish; the a7 var_hash UAF needs no special
; settings. display_errors off so nothing leaks via error text (the apps expose
; only their intended side effect).
memory_limit=128M
post_max_size=64M
max_input_vars=1000000
max_file_uploads=1000000
error_reporting=E_ALL
display_errors=0
log_errors=1
